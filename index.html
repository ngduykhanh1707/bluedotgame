<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>We've Moved — Simplay Studio</title>
  <meta name="description" content="Bluedot Game has renamed to Simplay Studio. You will be redirected shortly." />
  <meta name="google-site-verification" content="-0fhG2LqvjnbPLDETNlnfw7FDzCkh-CeS__3quwfEA0" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      overflow: hidden;
    }

    /* Background */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: linear-gradient(135deg, #e8f0fe 0%, #f0f4f8 50%, #e8f5e9 100%);
    }

    /* Soft decorative blobs */
    .bg::before, .bg::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
    }
    .bg::before {
      width: 500px; height: 500px;
      top: -120px; left: -100px;
      background: #c7d7fd;
    }
    .bg::after {
      width: 400px; height: 400px;
      bottom: -100px; right: -80px;
      background: #bbf7d0;
    }

    .particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
      animation: float linear infinite;
    }

    @keyframes float {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 0.5; }
      90%  { opacity: 0.25; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* Card */
    .card {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 56px 48px;
      max-width: 560px;
      width: 90%;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.04), 0 20px 60px rgba(0,0,0,0.08);
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #2563eb;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 100px;
      padding: 6px 16px;
      margin-bottom: 32px;
    }

    .brand-transition {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .brand-old {
      font-size: 20px;
      font-weight: 600;
      color: #94a3b8;
      text-decoration: line-through;
      text-decoration-color: #cbd5e1;
    }

    .arrow-icon {
      font-size: 20px;
      color: #2563eb;
      animation: pulse-arrow 2s ease-in-out infinite;
    }

    @keyframes pulse-arrow {
      0%, 100% { transform: translateX(0); opacity: 0.6; }
      50%       { transform: translateX(4px); opacity: 1; }
    }

    .brand-new {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, #2563eb, #059669);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    h1 {
      font-size: 32px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 14px;
      letter-spacing: -0.5px;
      color: #0f172a;
    }

    .subtitle {
      font-size: 15px;
      color: #64748b;
      line-height: 1.7;
      margin-bottom: 40px;
    }

    .subtitle strong {
      color: #1e1e1e;
      font-weight: 600;
    }

    /* Countdown ring */
    .countdown-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 32px;
    }

    .ring-container {
      position: relative;
      width: 80px;
      height: 80px;
    }

    .ring-svg {
      transform: rotate(-90deg);
      width: 80px;
      height: 80px;
    }

    .ring-track {
      fill: none;
      stroke: #e2e8f0;
      stroke-width: 4;
    }

    .ring-progress {
      fill: none;
      stroke: url(#ringGrad);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-dasharray: 207;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear;
    }

    .ring-number {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 800;
      color: #333333;
    }

    .countdown-label {
      font-size: 12px;
      color: #94a3b8;
      letter-spacing: 0.05em;
    }

    /* CTA Button */
    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 36px;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #2592eb, #059669);
      border: none;
      border-radius: 100px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.3);
      letter-spacing: 0.02em;
    }

    .cta-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(37, 99, 235, 0.4);
    }

    .cta-btn:active {
      transform: translateY(0);
    }

    .cta-arrow {
      transition: transform 0.2s;
    }

    .cta-btn:hover .cta-arrow {
      transform: translateX(4px);
    }

    .footer-note {
      margin-top: 28px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <div class="particles" id="particles"></div>

  <div class="card">
    <h1>We've Got a New Home</h1>
    <p class="subtitle">
      Blue DOT Game has renamed to <strong><span style="color: red">Sim</span>play Studio</strong>.<br>
    </p>

    <div class="countdown-wrap">
      <div class="ring-container">
        <svg class="ring-svg" viewBox="0 0 80 80">
          <defs>
            <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#666666"/>
              <stop offset="100%" stop-color="#333333"/>
            </linearGradient>
          </defs>
          <circle class="ring-track" cx="40" cy="40" r="33"/>
          <circle class="ring-progress" id="ringProgress" cx="40" cy="40" r="33"/>
        </svg>
        <div class="ring-number" id="countdownNum">10</div>
      </div>
      <span class="countdown-label">Redirecting in seconds…</span>
    </div>

    <a class="cta-btn" href="https://simplaystudio.com" id="ctaBtn">
      Visit Simplay Studio
      <span class="cta-arrow">→</span>
    </a>

    <p class="footer-note">You'll be redirected automatically. Click above to go now.</p>
  </div>

  <script>
    // Particles
    (function () {
      const container = document.getElementById('particles');
      const colors = ['#93e4fd', '#6ee7b7', '#bfdbfe', '#a7f3d0'];
      for (let i = 0; i < 30; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 4 + 2;
        p.style.cssText = [
          `width:${size}px`, `height:${size}px`,
          `left:${Math.random() * 100}%`,
          `background:${colors[Math.floor(Math.random() * colors.length)]}`,
          `animation-duration:${6 + Math.random() * 10}s`,
          `animation-delay:${Math.random() * 10}s`
        ].join(';');
        container.appendChild(p);
      }
    })();

    // Countdown + redirect
    (function () {
      const TOTAL = 10;
      const ring = document.getElementById('ringProgress');
      const num  = document.getElementById('countdownNum');
      const circumference = 2 * Math.PI * 33; // ≈ 207.3

      ring.style.strokeDasharray  = circumference;
      ring.style.strokeDashoffset = 0;

      let remaining = TOTAL;

      function tick() {
        remaining--;
        num.textContent = remaining;
        const offset = circumference * (1 - remaining / TOTAL);
        ring.style.strokeDashoffset = offset;

        if (remaining <= 0) {
          window.location.href = 'https://simplaystudio.com';
        } else {
          setTimeout(tick, 1000);
        }
      }

      setTimeout(tick, 1000);
    })();
  </script>
</body>
</html>
